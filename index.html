<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Learner Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F2E3; --paper:#FBFDFA; --ink:#17361F; --muted:#55694F; --line:#C5D9C0;
  --fern:#2F6B2F; --fern-soft:#CFE5CA; --amber:#E9A23B; --coral:#F2785C; --focus:#1B5FD6;
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Figtree',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
:root[data-theme="dark"]{--bg:#0E1A10;--paper:#15251A;--ink:#E4F0E1;--muted:#9DB398;--line:#2A4130;--fern:#8FCB78;--fern-soft:#21382A;--focus:#8DB8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A10;--paper:#15251A;--ink:#E4F0E1;--muted:#9DB398;--line:#2A4130;--fern:#8FCB78;--fern-soft:#21382A;--focus:#8DB8FF}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:720px}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:18px;background:none;border:0;cursor:pointer;padding:4px}
.bar nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lnk{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.lnk:hover{background:var(--fern-soft);color:var(--ink)}
.lnk[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;font-weight:600;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2b1c00}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{padding:8px 16px;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:28px 0 36px}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:700}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.4vw,24px);color:var(--muted);margin-top:16px;max-width:30ch}
.hero .cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .facts{margin-top:22px;color:var(--muted);font-size:15px}
#sky{width:100%;height:auto;display:block}
#sky .edge{stroke:var(--line);stroke-width:1.4;fill:none}
#sky .star{fill:var(--fern);opacity:0;transition:opacity .6s}
#sky .lbl{font:600 13px var(--sans);fill:var(--muted);opacity:0;transition:opacity .6s}
#sky .on{opacity:1}
#sky .sun{fill:var(--amber);opacity:1}
#sky .halo{fill:var(--amber);opacity:.25;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.08;transform:scale(1.5)}}
#sky .halo{transform-box:fill-box;transform-origin:center}
.caption{font-family:var(--serif);font-style:italic;color:var(--muted);text-align:center;margin-top:4px}
/* sheets */
.sheet{background:var(--paper);border:1.5px solid var(--ink);border-radius:20px;padding:clamp(20px,4vw,40px)}
.sheet.soft{border-color:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.path{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper)}
.path h2{font-size:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
textarea{min-height:110px;resize:vertical}
.err{color:#B3261E;font-size:14px;min-height:1.2em}
:root[data-theme="dark"] .err{color:#FFB4A8}
/* survey */
.steps{display:flex;gap:0;align-items:center;margin:8px 0 26px}
.dot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:500}
.dot i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--paper)}
.dot.cur{color:var(--ink)}.dot.cur i{border-color:var(--amber);background:var(--amber);color:#2b1c00}
.dot.done i{border-color:var(--fern);background:var(--fern);color:var(--paper)}
.seg{flex:1;height:2px;background:var(--line);margin:0 8px;min-width:12px}.seg.done{background:var(--fern)}
.dot span{display:none}.dot.cur span{display:inline}
@media(min-width:760px){.dot span{display:inline}}
.q{margin:0 0 34px;border:0;padding:0}
.q legend{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3vw,28px);padding:0;margin-bottom:4px;line-height:1.2}
.q .hint{color:var(--muted);font-size:14px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500;transition:background .15s,border-color .15s}
.chip input:hover+span{border-color:var(--fern)}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip input:disabled+span{opacity:.4}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.rate{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:10px 16px;align-items:center}
.rate .nm{font-weight:600}.rate .nm small{display:block;font-weight:400;color:var(--muted)}
.scale{display:flex;gap:6px}
.scale label{flex:1;position:relative}
.scale input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.scale span{display:grid;place-items:center;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-weight:600}
.scale input:checked+span{background:var(--amber);border-color:var(--amber);color:#2b1c00}
.scale input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.ends{grid-column:2;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-6px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;align-items:center;flex-wrap:wrap}
.consent{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:14px;background:var(--fern-soft)}
.consent input{margin-top:5px;width:18px;height:18px;accent-color:var(--fern)}
.progress-note{color:var(--muted);font-size:14px}
/* result */
.res-top{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.res h1{font-size:clamp(30px,5vw,48px)}
.signal{font-family:var(--serif);font-size:clamp(26px,4vw,40px);font-weight:700;color:var(--fern);margin:4px 0 8px}
.rows{margin:26px 0 0;border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row dt{font-family:var(--serif);font-weight:600}
.row dd{margin:0}
.tag{display:inline-block;margin:2px 6px 2px 0;padding:3px 12px;border-radius:999px;background:var(--fern-soft);font-size:14px;font-weight:500}
.tag.am{background:#F7E2B8;color:#3b2900}
:root[data-theme="dark"] .tag.am{background:#4a3a14;color:#F7E2B8}
.quote{font-family:var(--serif);font-style:italic;font-size:19px;border-left:4px solid var(--amber);padding-left:14px}
/* tutor */
.dash h1{font-size:clamp(30px,5vw,50px)}
.lede{font-family:var(--serif);font-size:clamp(22px,3vw,32px);line-height:1.25;max-width:30ch;margin:14px 0 6px}
.lede b{background:linear-gradient(transparent 62%,#F7D690 62%);font-weight:700}
.kpis{display:flex;flex-wrap:wrap;gap:0;margin:26px 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.kpi{flex:1 1 180px;padding:16px 18px 16px 0;margin-right:18px}
.kpi .n{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.kpi .l{color:var(--muted);font-size:14px;margin-top:6px}
.sec{margin:46px 0 0}
.sec>h2{font-size:clamp(24px,3.4vw,34px);margin-bottom:6px}
.sec>.d{color:var(--muted);margin-bottom:18px;max-width:62ch}
table.map{width:100%;border-collapse:collapse;background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden}
table.map th,table.map td{padding:14px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.map th{font-family:var(--serif);font-weight:600;width:190px;background:var(--fern-soft)}
table.map tr:last-child td,table.map tr:last-child th{border-bottom:0}
table.map td b{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.bars{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(120px,210px) 1fr 44px;gap:10px;align-items:center;font-size:15px}
.bars .t{height:12px;background:var(--fern-soft);border-radius:6px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--fern);border-radius:6px;transform-origin:left;animation:grow .7s ease-out}
.bars li.top .t i{background:var(--amber)}
@keyframes grow{from{transform:scaleX(0)}}
.bars .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 12px}
.mix{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1.5px solid var(--ink)}
.mix div{display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.moves{counter-reset:m;display:grid;gap:0;border-top:1.5px solid var(--ink)}
.move{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.move:before{counter-increment:m;content:counter(m);font-family:var(--serif);font-weight:700;font-size:26px;color:var(--amber);line-height:1}
.move b{display:block;font-size:17px}
.move small{color:var(--muted)}
.voice{padding:14px 0;border-bottom:1px solid var(--line)}
.voice q{font-family:var(--serif);font-style:italic;font-size:18px;quotes:"\201C" "\201D"}
.voice .by{color:var(--muted);font-size:13px;margin-top:4px}
.banner{background:#F7E2B8;color:#3b2900;border-radius:12px;padding:10px 16px;font-size:14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.notice{border:1.5px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.journey{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:10px}
.jcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:13px;color:var(--muted)}
.jcol i{display:block;width:100%;max-width:56px;background:var(--fern);border-radius:8px 8px 0 0}
.jcol.empty i{background:transparent;border:1.5px dashed var(--line);height:20px!important}
.jcol b{color:var(--ink);font-family:var(--serif)}
footer{padding:50px 0 40px;color:var(--muted);font-size:14px}
@media(max-width:820px){
  .hero,.two,.res-top,.grid2{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:4px}
  .rate{grid-template-columns:1fr}.ends{grid-column:1}
  table.map th{width:auto;display:block;border-bottom:0}table.map td{display:block}
  .bars li{grid-template-columns:1fr 44px}.bars li .t{grid-column:1 / -1;order:3}
  .move{grid-template-columns:32px 1fr}.move .tools{grid-column:2}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media print{
  body{background:#fff;color:#000}.noprint,.bar,footer{display:none!important}
  .sheet,table.map{border-color:#999}.sec{break-inside:avoid}
}
.byline{margin:6px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.6}
.byline b{color:var(--ink);font-weight:600}
</style>
<div class="wrap">
  <header class="bar noprint">
    <button class="brand" data-go="#/" aria-label="Home">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 22 12 12 18 18 25 6" stroke="currentColor" stroke-opacity=".35" stroke-width="1.6" fill="none"/><circle cx="5" cy="22" r="3.4" fill="#E9A23B"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="18" cy="18" r="2.4" fill="currentColor"/><circle cx="25" cy="6" r="2.4" fill="currentColor"/></svg>
      <span id="brandName">Learner Profile</span>
    </button>
    <nav aria-label="Main">
      <button class="lnk" id="navTutor" data-go="#/tutor"></button>
      <button class="lnk" id="langEN" data-lang="en" aria-pressed="true">EN</button>
      <button class="lnk" id="langZH" data-lang="zh" aria-pressed="false">中文</button>
    </nav>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>

<script>
/* ============================================================
   Learner Profile: front-end prototype
   All data lives in this browser (localStorage). No server yet.
   Swap the `Store` object for API calls when the backend exists.
   ============================================================ */
const MEM = {};
const Store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return k in MEM?MEM[k]:d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ MEM[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete MEM[k]; } }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];

/* ---------- Content (ids are language neutral; labels are EN / ZH) ---------- */
const OPT = {
  think:[['talk','Talking through ideas','边说边想'],['write','Writing quietly','安静地写'],['sketch','Sketching','画草图'],['read','Reading first','先阅读'],['watch','Watching examples','看示例'],['try','Trying things myself','自己动手试'],['group','Working with others','与他人合作'],['teach','Teaching someone else','教别人']],
  before:[['time','Need time to think','需要时间思考'],['hear','Want to hear others first','想先听听别人'],['notes','Like writing notes','喜欢先写笔记'],['example','Need an example','需要一个例子'],['private','Prefer asking questions privately','更愿意私下提问']],
  when:[['open','Questions are open ended','问题是开放式的'],['nowrong','There are no wrong answers','没有标准答案'],['small','Small groups','小组讨论'],['anon','Anonymous tools (Mentimeter, Padlet)','匿名工具(Mentimeter、Padlet)'],['polls','Polls','投票'],['hands','Hands on activities','动手活动'],['cases','Real case studies','真实案例'],['visual','Visual examples','有视觉示例']],
  barriers:[['wrong','Fear of being wrong','害怕答错'],['english','English language','英语表达'],['time','Processing time','需要处理时间'],['large','Large classes','班级太大'],['anxiety','Speaking anxiety','发言焦虑'],['expect','Unsure what is expected','不清楚老师期待什么'],['past','Previous negative experiences','以往不愉快的经历'],['confidence','Lack of confidence','缺乏信心'],['none','None of these','以上都不是']],
  invisible:[['notes','Taking notes','记笔记'],['encourage','Encouraging peers','鼓励同伴'],['thinking','Thinking deeply','深入思考'],['connections','Looking for connections','寻找联系'],['online','Sharing online','在线分享'],['help','Helping after class','课后帮助别人'],['prepare','Preparing thoroughly','认真预习'],['reflect','Reflecting afterwards','课后反思']],
  prefs:[['speak','Speaking','口头发言'],['chat','Chat','聊天框'],['sticky','Sticky notes','便利贴'],['polls','Polls','投票'],['whiteboard','Whiteboard','白板'],['drawing','Drawing','绘画'],['journal','Reflection journals','反思日志'],['board','Discussion board','讨论区'],['peer','Peer feedback','同伴反馈'],['collab','Collaborative documents','协作文档']],
  roles:[['visualiser','Visualiser','视觉化者','Turns ideas into sketches and maps','把想法变成草图和图表'],['summariser','Summariser','总结者','Pulls the discussion into key points','把讨论提炼成要点'],['challenger','Challenger','挑战者','Questions assumptions, respectfully','礼貌地质疑假设'],['presenter','Presenter','汇报者','Shares the group’s thinking with the class','向全班分享小组的想法'],['timekeeper','Time-Keeper','计时员','Keeps the group on pace','掌握小组节奏'],['organiser','Organiser','组织者','Coordinates tasks and next steps','协调任务与下一步']],
  strengths:[['ask','Questioner','提问者','Asking questions','提出问题'],['listen','Listener','倾听者','Listening attentively','认真倾听'],['connect','Connector','连接者','Connecting ideas','连接想法'],['support','Supporter','支持者','Supporting classmates','支持同学'],['create','Creator','创造者','Creative thinking','创意思考'],['solve','Problem Solver','解决者','Problem solving','解决问题'],['reflect','Reflector','反思者','Reflection','反思'],['lead','Leader','领导者','Leadership','领导力']]
};
const label = (set,id,lang) => { const o=OPT[set].find(x=>x[0]===id); return o ? (lang==='zh'?o[2]:o[1]) : id; };

/* Info-processing tendencies from slide 11. Shown to the student as a "tendency today", never as a type. */
const ARCH = {
  processor:{en:'The Processor',zh:'沉淀者',d:{en:'Needs time to synthesise before speaking.',zh:'发言前需要时间消化整合。'},c:'#2F6B2F',adj:'reflective'},
  scribe:{en:'The Scribe',zh:'记录者',d:{en:'Connects ideas through writing and visual mapping.',zh:'通过书写和视觉图示连接想法。'},c:'#E9A23B',adj:'visual'},
  catalyst:{en:'The Catalyst',zh:'催化者',d:{en:'Thrives on immediate verbal exchange.',zh:'在即时的口头交流中最有活力。'},c:'#F2785C',adj:'conversational'},
  observer:{en:'The Observer',zh:'观察者',d:{en:'Learns by analysing the patterns of others.',zh:'通过分析他人的模式来学习。'},c:'#4F7CAC',adj:'observational'}
};
const WEIGHTS = {
  think:{talk:{catalyst:2},write:{processor:1,scribe:1},sketch:{scribe:2},read:{processor:2},watch:{observer:2},try:{observer:1,processor:1},group:{catalyst:2},teach:{catalyst:1,processor:1}},
  before:{time:{processor:2},hear:{observer:2},notes:{scribe:2},example:{observer:1,processor:1},private:{processor:1,observer:1}},
  when:{open:{catalyst:1},nowrong:{processor:1},small:{catalyst:1},anon:{observer:1},polls:{observer:1},hands:{scribe:1},cases:{observer:1},visual:{scribe:1}}
};

/* Teaching moves (slide 18, "Teaching implication"). Each answer id maps to something a tutor can do next week. */
const MOVES = {
  'before.time':{tag:'Pace',m:'Add 45 to 60 seconds of silent think time before any discussion, and post the question before class.'},
  'before.hear':{tag:'Pace',m:'Take two or three contributions first, then open the floor, so quieter students can calibrate.'},
  'before.notes':{tag:'Channel',m:'Let students write a line before speaking. Start discussion from what they wrote.'},
  'before.example':{tag:'Scaffold',m:'Show a worked example before asking for ideas. One real case beats a definition.'},
  'before.private':{tag:'Channel',m:'Open a private question channel (form or chat) and answer a few aloud, anonymously.'},
  'when.small':{tag:'Format',m:'Use pair then share, and groups of 3 to 4, before whole-class discussion.'},
  'when.nowrong':{tag:'Safety',m:'Phrase prompts as "what might be true?" rather than "what is the answer?".'},
  'when.open':{tag:'Prompt',m:'Replace closed recall questions with open prompts that have several valid answers.'},
  'when.anon':{tag:'Channel',m:'Run a Mentimeter or Padlet round first, then discuss the results out loud.'},

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickW(r,w,k){const ids=Object.keys(w),out=[];while(out.length<k&&ids.length){const tot=ids.reduce((s,i)=>s+w[i],0);let x=r()*tot,i=0;for(;i<ids.length;i++){x-=w[ids[i]];if(x<=0)break}i=Math.min(i,ids.length-1);out.push(ids[i]);ids.splice(i,1)}return out}
function seedDemo(){

      before:pickW(r,{time:5,hear:3,notes:3,example:2,private:2.2},1+Math.floor(r()*2)),
      when:pickW(r,{small:6.5,nowrong:3.5,open:2,anon:3,polls:1.6,hands:3,cases:2.5,visual:2.5},2+Math.floor(r()*2)),

function archetype(r){
  const s={processor:0,scribe:0,catalyst:0,observer:0};
  for(const q of ['think','before','when'])(r[q]||[]).forEach(id=>{const w=(WEIGHTS[q][id]||{});for(const k in w)s[k]+=w[k]});
  const ord=Object.entries(s).sort((a,b)=>b[1]-a[1]);
  return {top:ord[0][0],second:ord[1][1]>0&&ord[1][1]>=ord[0][1]*.7?ord[1][0]:null,scores:s};
}
function tally(rs,q){const m={};rs.forEach(r=>(r[q]||[]).forEach(id=>m[id]=(m[id]||0)+1));return m}
function ranked(rs,q){const m=tally(rs,q),n=rs.length||1;return Object.entries(m).map(([id,c])=>({id,c,p:c/n})).sort((a,b)=>b.c-a.c)}
function analyse(rs){
  const n=rs.length,S={n};
  ['think','before','when','barriers','invisible','prefs','roles'].forEach(q=>S[q]=ranked(rs,q));
  const p=(q,id)=>(S[q].find(x=>x.id===id)||{p:0}).p;
  S.p=p;
  S.strengths=OPT.strengths.map(([id])=>({id,avg:n?rs.reduce((a,r)=>a+(r.strengths?.[id]||0),0)/n:0})).sort((a,b)=>b.avg-a.avg);
  S.arch={processor:0,scribe:0,catalyst:0,observer:0};rs.forEach(r=>S.arch[archetype(r).top]++);
  S.topArch=Object.entries(S.arch).sort((a,b)=>b[1]-a[1])[0]?.[0]||'processor';
  S.roleCover=OPT.roles.map(([id])=>({id,c:(S.roles.find(x=>x.id===id)||{c:0}).c}));
  // moves: score by prevalence, keep variety
  const cand=[];
  [['before',S.before],['when',S.when],['barriers',S.barriers],['prefs',S.prefs]].forEach(([q,list])=>list.forEach(x=>{const m=MOVES[q+'.'+x.id];if(m)cand.push({q,id:x.id,p:x.p,c:x.c,...m})}));
  cand.sort((a,b)=>b.p-a.p);const used=new Set(),moves=[];
  for(const c of cand){if(moves.length>=5)break;if(used.has(c.tag)&&moves.length<3)continue;used.add(c.tag);moves.push(c)}
  S.moves=moves;
  // week journey
  S.journey=[1,3,5,8,12].map(w=>{const v=[];rs.forEach(r=>(r.checkins||[]).forEach(c=>{if(c.week===w)v.push(c.score)}));return {w,n:v.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});
  return S;
}

function radarSVG(vals,size=300){
  const c=size/2,R=size*.34,n=vals.length;
  const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(ang)*R*v/5,c+Math.sin(ang)*R*v/5]};
  const rings=[1,2,3,4,5].map(k=>`<polygon points="${vals.map((_,i)=>pt(i,k).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const axes=vals.map((_,i)=>`<line x1="${c}" y1="${c}" x2="${pt(i,5)[0]}" y2="${pt(i,5)[1]}" stroke="var(--line)"/>`).join('');
  const poly=vals.map((v,i)=>pt(i,v.v).join(',')).join(' ');
  const labels=vals.map((v,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n,x=c+Math.cos(ang)*(R+22),y=c+Math.sin(ang)*(R+22);const anc=Math.cos(ang)>.3?'start':Math.cos(ang)<-.3?'end':'middle';return `<text x="${x}" y="${y+4}" text-anchor="${anc}" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(v.n)}</text>`}).join('');
  return `<svg viewBox="-70 -6 ${size+140} ${size+12}" width="100%" role="img" aria-label="Strengths radar">${rings}${axes}<polygon points="${poly}" fill="#E9A23B" fill-opacity=".35" stroke="#E9A23B" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${pt(i,v.v)[0]}" cy="${pt(i,v.v)[1]}" r="4" fill="#E9A23B"/>`).join('')}${labels}</svg>`;
}

function submitSurvey(){
  const r={id:meId&&local.find(x=>x.id===meId)?meId:'me-'+Date.now(),ts:Date.now(),
    name:(draft.name||'').trim(),shareName:!!draft.shareName&&!!(draft.name||'').trim(),
    think:draft.think||[],before:draft.before||[],when:draft.when||[],strengths:draft.strengths||{},roles:draft.roles||[],
    barriers:draft.barriers||[],invisible:draft.invisible||[],prefs:draft.prefs||[],growth:(draft.growth||'').trim(),help:(draft.help||'').trim(),
    checkins:[]};
  const old=local.find(x=>x.id===r.id); if(old){r.checkins=old.checkins||[]}
  local=local.filter(x=>x.id!==r.id);local.push(r);Store.set('lp.responses',local);meId=r.id;Store.set('lp.me',meId);

async function getDownloads(){
  try{ if(window.claude&&window.claude.use) return await window.claude.use('downloads'); }catch(e){}
  return null;
}
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[data-src="'+src+'"]'))return res();
    const el=document.createElement('script');el.src=src;el.dataset.src=src;el.onload=res;el.onerror=()=>rej(new Error('load failed'));document.head.appendChild(el);
  });
}
/* Save as PDF: in a viewer that offers the downloads capability, build a PDF in the page.
   In a plain browser (the local HTML file), use the browser's print dialog instead. */
async function savePDF(sel,filename,btn){
  const dl=await getDownloads();
  if(!dl){ window.print(); return; }
  const msg=$('#pdfMsg'),label=btn.textContent;
  btn.disabled=true;btn.textContent=lang==='zh'?'正在生成…':'Preparing PDF…';if(msg)msg.textContent='';
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el=$(sel);
    const bg=getComputedStyle(document.body).backgroundColor;
    const canvas=await window.html2canvas(el,{scale:2,backgroundColor:bg,ignoreElements:n=>n.classList&&n.classList.contains('noprint')});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const pw=210,ph=297,m=10,w=pw-2*m,pxPerMm=canvas.width/w,sliceH=Math.floor((ph-2*m-6)*pxPerMm);
    let y=0,page=0;
    while(y<canvas.height){
      const h=Math.min(sliceH,canvas.height-y),c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,h);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page>0)pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',m,m,w,h/pxPerMm);
      pdf.setFontSize(8);pdf.setTextColor(110);
      pdf.text('Learner Profile prototype v1 | Created by Jessie Li | Demo only. Saved on this device.',m,ph-6);
      y+=h;page++;
    }
    await dl.save({filename,data:pdf.output('blob')});
  }catch(e){
    if(!(e&&e.code==='declined')&&msg)msg.textContent=lang==='zh'?'无法生成 PDF。请再试一次。':'Could not make the PDF. Try again.';
  }finally{btn.disabled=false;btn.textContent=label}
}
async function downloadCSV(){
  const rs=allResponses();
  const cols=['think','before','when','roles','barriers','invisible','prefs'];
  const head=['id','name_if_shared',...cols,...OPT.strengths.map(s=>'strength_'+s[0]),'growth','help'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=rs.map(r=>[r.id,r.shareName?r.name:'',...cols.map(c=>(r[c]||[]).join(';')),...OPT.strengths.map(s=>r.strengths?.[s[0]]||''),r.growth,r.help].map(q).join(','));
  const text='\ufeff'+head.join(',')+'\n'+rows.join('\n');
  const dl=await getDownloads();
  if(dl){ try{ await dl.save({filename:'learner-profile-class.csv',data:text}); }catch(e){} return; }
  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='learner-profile-class.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g&&!g.hasAttribute('data-act')){go(g.dataset.go);return}
  const l=e.target.closest('[data-lang]'); if(l){lang=l.dataset.lang;Store.set('lp.lang',lang);chrome();render();return}
  const a=e.target.closest('[data-act]'); if(!a)return;
  const act=a.dataset.act;
  if(act==='back'){ if(step===0){go('#/join')}else{step--;persistDraft();viewSurvey()} }
  else if(act==='next'){ if(stepComplete(STEPS[step])){step++;persistDraft();viewSurvey()} }
  else if(act==='finish'){ submitSurvey() }
  else if(act==='edit'){ const r=local.find(x=>x.id===meId); if(r){draft={...r,_step:0};step=0;persistDraft();go('#/survey')} }
  else if(act==='toggleDemo'){ useDemo=!useDemo;Store.set('lp.demo',useDemo);viewTutor() }
  else if(act==='csv'){ downloadCSV() }
  else if(act==='pdf'){ savePDF('.res .sheet','learner-profile-my-profile.pdf',a) }
  else if(act==='pdfTutor'){ savePDF('#app > div','learner-profile-class-summary.pdf',a) }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('.chip input')){
    const q=STEPS[step].qs.find(x=>x.id===t.name); if(!q)return;
    let sel=draft[q.id]||[];
    if(t.checked){ if(t.value==='none')sel=['none']; else sel=sel.filter(x=>x!=='none').concat(t.value) }
    else sel=sel.filter(x=>x!==t.value);
    draft[q.id]=sel;persistDraft();
    const cap=q.max||0,full=cap&&sel.length>=cap;
    $$(`.chip input[name="${q.id}"]`).forEach(i=>{i.checked=sel.includes(i.value);i.disabled=!!(full&&!i.checked)});
  } else if(t.matches('.scale input[name^="st-"]')){
    draft.strengths=draft.strengths||{};draft.strengths[t.name.slice(3)]=+t.value;persistDraft();
  } else if(t.id==='shareName'){draft.shareName=t.checked;persistDraft()}
  refreshStep();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.text){draft[t.dataset.text]=t.value;persistDraft()}
  else if(t.id==='nm'){draft.name=t.value;persistDraft()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='joinForm'){
    e.preventDefault();
    const v=$('#code').value.trim().toUpperCase();
    if(v===cls.code.toUpperCase()){Store.set('lp.joined',true);step=draft._step||0;go('#/survey')}
    else{$('#codeErr').textContent=T(UI.codeErr)}
  } else if(e.target.id==='ckForm'){
    e.preventDefault();
    const r=local.find(x=>x.id===meId);const sc=+(new FormData(e.target).get('ck')||0);
    if(!r||!sc){$('#ckMsg').textContent=lang==='zh'?'请先选一个分数。':'Pick a score from 1 to 5 first.';return}
    const w=+$('#ckw').value;r.checkins=(r.checkins||[]).filter(c=>c.week!==w).concat({week:w,score:sc,text:$('#ckt').value.trim()});
    Store.set('lp.responses',local);viewResult();
  }
});

/* ---------- Router & chrome ---------- */
function chrome(){
  document.documentElement.lang=lang==='zh'?'zh-Hans':'en';
  $('#navTutor').textContent=T(UI.tutorView);
  $('#langEN').setAttribute('aria-pressed',lang==='en');$('#langZH').setAttribute('aria-pressed',lang==='zh');
  $('#foot').innerHTML=lang==='zh'?'前端原型。所有数据只保存在此浏览器中,尚未连接服务器。':'Front end prototype. Everything is stored in this browser only. No server is connected yet.';
}
function render(){
  const h=location.hash||'#/';
  chrome();
  if(h==='#/join')viewJoin();
  else if(h==='#/survey'){ if(!Store.get('lp.joined',false)){go('#/join');return} viewSurvey() }
  else if(h==='#/result')viewResult();
  else if(h==='#/tutor')viewTutor();
  else viewHome();
}
window.addEventListener('hashchange',render);
render();
</script>

</body></html>
